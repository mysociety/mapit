[tox]
envlist = flake8, py313-{4.2,5.2,6}

[testenv]
commands =
    flake8: flake8 mapit mapit_gb mapit_it mapit_no mapit_se mapit_za project
    py313: python -W all -W ignore::PendingDeprecationWarning -m coverage run --source mapit manage.py test mapit mapit_gb
deps =
    py313: coverage
    flake8: flake8
    4.2: Django>=4.2,<5.0
    5.2: Django>=5.2,<6.0
    6: Django>=6.0,<7.0
passenv =
    CFLAGS
    PYTHONWARNINGS
setenv =
    PYTHONDONTWRITEBYTECODE=1

[testenv:flake8]
skip_install = True

[gh-actions]
python =
    3.13: flake8, py313

[gh-actions:env]
THING_TO_TEST =
  flake8: flake8
  4.2: 4.2
  5.2: 5.2
  6: 6
